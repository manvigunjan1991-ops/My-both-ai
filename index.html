<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Clone — OpenRouter</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              bg: '#131314',
              surface: '#1e1f20',
              sidebar: '#111214',
              input: '#282a2c',
              accent: '#a8c7fa',
              accentHover: '#b3d1ff',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #444746;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5f6368;
    }
  </style>
</head>
<body class="bg-gemini-bg text-[#e3e3e3] h-screen overflow-hidden flex flex-col">

  <!-- Main Layout Container -->
  <div class="flex h-full w-full">

    <!-- Sidebar: Chat History -->
    <aside id="sidebar" class="bg-gemini-sidebar w-64 flex-shrink-0 flex flex-col border-r border-[#282a2c] transition-all duration-300 z-30">
      <!-- Top Sidebar Actions -->
      <div class="p-3 flex items-center justify-between">
        <button id="toggleSidebarBtn" class="p-2 hover:bg-[#282a2c] rounded-full transition-colors" title="Toggle Sidebar">
          <i data-lucide="panel-left" class="w-5 h-5"></i>
        </button>
        <button id="newChatBtn" class="flex items-center gap-2 bg-gemini-input hover:bg-[#34373a] text-sm px-4 py-2 rounded-full transition-colors font-medium">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>New chat</span>
        </button>
      </div>

      <!-- Recent Chats List -->
      <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1">
        <div class="px-3 py-1 text-xs font-semibold text-[#c4c7c5] uppercase tracking-wider">Recent</div>
        <div id="chatHistoryList" class="space-y-1">
          <!-- Dynamically populated via LocalStorage -->
        </div>
      </div>

      <!-- Footer Actions: Settings Modal trigger -->
      <div class="p-3 border-t border-[#282a2c] flex flex-col gap-1">
        <button id="openSettingsBtn" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg hover:bg-[#282a2c] text-sm transition-colors text-left">
          <i data-lucide="settings" class="w-5 h-5 text-gemini-accent"></i>
          <span>API Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="flex-1 flex flex-col h-full relative">
      <!-- Top Bar -->
      <header class="h-14 flex items-center justify-between px-4 border-b border-[#282a2c] bg-gemini-bg/80 backdrop-blur z-20">
        <div class="flex items-center gap-2">
          <span class="text-lg font-semibold tracking-wide text-[#e3e3e3]">Gemini</span>
          <span id="currentModelBadge" class="text-xs bg-gemini-surface border border-[#3c4043] px-2 py-0.5 rounded-full text-gemini-accent">
            google/gemini-2.0-flash-exp:free
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button id="clearChatBtn" class="text-xs text-[#c4c7c5] hover:text-white px-3 py-1.5 rounded-lg hover:bg-[#282a2c] transition-colors">
            Clear History
          </button>
        </div>
      </header>

      <!-- Chat Messages Container -->
      <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6">
        <div class="max-w-3xl mx-auto space-y-6" id="messagesList">
          <!-- Empty State Greeting -->
          <div id="welcomeState" class="py-12 text-center space-y-3">
            <h1 class="text-4xl font-semibold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
              Hello, Developer
            </h1>
            <p class="text-[#c4c7c5] text-lg">How can I help you today?</p>
          </div>
        </div>
      </div>

      <!-- Prompt Input Area -->
      <div class="p-4 bg-gemini-bg border-t border-[#282a2c]">
        <div class="max-w-3xl mx-auto">
          <form id="chatForm" class="relative bg-gemini-input rounded-2xl border border-[#3c4043] focus-within:border-gemini-accent transition-colors">
            <textarea
              id="promptInput"
              rows="1"
              placeholder="Enter a prompt here..."
              class="w-full bg-transparent text-sm text-[#e3e3e3] placeholder-[#c4c7c5] resize-none outline-none py-3.5 pl-4 pr-12 max-h-40"
            ></textarea>
            <button
              type="submit"
              id="sendBtn"
              class="absolute right-2 bottom-2 p-2 bg-gemini-accent text-gemini-bg rounded-xl hover:bg-gemini-accentHover transition-colors disabled:opacity-40"
              title="Send message"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
          <p class="text-[11px] text-center text-[#c4c7c5] mt-2">
            AI can make mistakes. Verify important info. Connected via OpenRouter.
          </p>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-gemini-surface border border-[#3c4043] rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">OpenRouter Settings</h2>
        <button id="closeSettingsBtn" class="p-1.5 hover:bg-[#383a3c] rounded-lg text-[#c4c7c5]">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-[#c4c7c5] mb-1">OpenRouter API Key</label>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="sk-or-v1-..."
            class="w-full bg-gemini-input border border-[#3c4043] rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-gemini-accent"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-[#c4c7c5] mb-1">Model Name</label>
          <input
            id="modelNameInput"
            type="text"
            value="google/gemini-2.0-flash-exp:free"
            placeholder="google/gemini-2.0-flash-exp:free"
            class="w-full bg-gemini-input border border-[#3c4043] rounded-lg px-3.5 py-2.5 text-sm outline-none focus:border-gemini-accent"
          />
          <p class="text-[11px] text-[#c4c7c5] mt-1">Example: google/gemini-2.0-flash-exp:free or anthropic/claude-3.5-sonnet</p>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="saveSettingsBtn" class="bg-gemini-accent text-gemini-bg font-medium px-4 py-2 rounded-lg text-sm hover:bg-gemini-accentHover transition-colors">
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <!-- Script placed at the end of body to prevent blank page errors -->
  <script>
    // State management
    let state = {
      apiKey: localStorage.getItem('openrouter_api_key') || '',
      model: localStorage.getItem('openrouter_model') || 'google/gemini-2.0-flash-exp:free',
      currentChatId: null,
      chats: JSON.parse(localStorage.getItem('gemini_clone_chats') || '[]')
    };

    // DOM Elements
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatHistoryList = document.getElementById('chatHistoryList');
    const messagesList = document.getElementById('messagesList');
    const welcomeState = document.getElementById('welcomeState');
    const chatForm = document.getElementById('chatForm');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentModelBadge = document.getElementById('currentModelBadge');
    const clearChatBtn = document.getElementById('clearChatBtn');

    // Settings Modal elements
    const settingsModal = document.getElementById('settingsModal');
    const openSettingsBtn = document.getElementById('openSettingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelNameInput = document.getElementById('modelNameInput');

    // Initialize Lucide Icons
    function refreshIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Save chats to LocalStorage
    function saveChats() {
      localStorage.setItem('gemini_clone_chats', JSON.stringify(state.chats));
      renderSidebar();
    }

    // Render Sidebar History
    function renderSidebar() {
      chatHistoryList.innerHTML = '';
      if (state.chats.length === 0) {
        chatHistoryList.innerHTML = `<div class="px-3 py-2 text-xs text-[#c4c7c5]">No previous chats</div>`;
        return;
      }

      state.chats.forEach(chat => {
        const isActive = chat.id === state.currentChatId;
        const el = document.createElement('button');
